services:
  #--- MinIO (S3-compatible Object Storage) ---
  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"  # API
      - "9001:9001"  # Console UI
    volumes:
      - minio-data:/data
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  #--- MinIO Client - Create bucket on startup ---
  minio-create-bucket:
    image: minio/mc:latest
    container_name: minio-create-bucket
    depends_on:
      - minio
    networks:
      - app-net
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb myminio/chat-files --ignore-existing;
      /usr/bin/mc anonymous set download myminio/chat-files;
      echo 'Bucket configurado correctamente';
      exit 0;
      "

  #--- Servicio de Autenticación ---
  auth-api:
    build:
      # El 'contexto' es la carpeta del microservicio
      context: ./authentication-microservice/src
      # Opcional, pero explícito:
      dockerfile: Dockerfile
    restart: unless-stopped 
    container_name: auth-api
    env_file:
      # La ruta al .env, relativa al compose.yaml
      - ./.env
    ports:
      - "3000:${PORT}" # Host:Container
    networks:
      - app-net

  #--- Servicio de Gestión de Mensajes ---
  message-management-microservice:
    build:
      context: ./message-management-microservice
      dockerfile: Dockerfile
    restart: unless-stopped
    container_name: message-management-microservice
    env_file:
      - ./.env
    ports:
      - "3002:3002" # Puerto para el servicio de mensajes
    networks:
      - app-net
    depends_on:
      - auth-api
      - minio
    volumes:
      # Montar las llaves JWT (la pública para verificar tokens)
      - ./authentication-microservice/src/keys/ec_public.pem:/app/keys/ec_public.pem:ro

  #--- API Gateway ---
  api-gateway:
    build:
      context: ./api-gateway # La carpeta de tu Gateway
      dockerfile: Dockerfile
    restart: unless-stopped
    container_name: api-gateway
    env_file:
      - ./.env # Usamos el mismo .env
    ports:
      # El puerto 8080 del HOST (tu PC) se conecta al G_PORT del CONTENEDOR
      - "8080:${G_PORT}" 
    networks:
      - app-net
    depends_on:
      # Le dice a Docker: "No arranques el Gateway HASTA QUE
      # auth-api (y message-api) ya estén corriendo".
      - auth-api
      - message-management-microservice
      # - image-api

networks:
  app-net:
    driver: bridge

volumes:
  minio-data:
    driver: local
